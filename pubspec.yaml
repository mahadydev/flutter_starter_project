name: flutter_starter_project
description: "A flutter starting template for new project (clean architecture+bloc/cubit)"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=3.13.7"
  flutter: ">=3.47.9"
dependencies:
  connectivity_plus: 7.3.2
  cupertino_icons: 2.0.0
  dio: 5.11.1
  drift: 2.35.3
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_dotenv: 6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: 2.4.8
  flutter_screenutil: 5.9.3
  flutter_secure_storage: 11.2.0
  freezed_annotation: 3.1.0
  get_it: 9.3.0
  go_router: 18.1.2
  google_fonts: 9.0.0
  internet_connection_checker_plus: 3.1.2
  intl: 0.20.3
  json_annotation: 4.12.0
  logger: 2.8.0
  material_ui: 1.9.0
  nested: any
  path: 1.9.1
  path_provider: 2.1.6
  pretty_dio_logger: 1.4.0
  retrofit: 4.10.0
  shared_preferences: 2.5.6
dev_dependencies:
  build_runner: 2.16.2
  drift_dev: 2.35.2
  flutter_gen_runner: 5.15.0
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  json_serializable: 6.15.2
  retrofit_generator: 10.3.2


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/.env